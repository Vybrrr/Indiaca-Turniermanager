    ========================================================================
    VERSION: 6.4
    PROJEKT: Turnier & Vereinsmanager (Supabase Cloud Backend)
    BESCHREIBUNG: Vereins-Startansicht mit Sortierung, Turnier-Anmeldeschluss &
                  Rollenprüfung (ClubManager / TeamCoach), Nickname-Fix & Homepage
    ========================================================================
-->
<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnier Manager - v6.4</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">

    <!-- =====================================================================
         PROZESSSCHRITT 0: APP CONTAINER & GLOBALES FOOTER-LAYOUT
         ===================================================================== -->
    <div id="app" class="flex-grow flex flex-col justify-between w-full max-w-5xl mx-auto p-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 m-auto"></div>
    </div>

    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-4 text-center text-xs text-gray-500 dark:text-gray-400 transition-colors duration-200 w-full">
        <div class="space-x-3">
            <button onclick="openModal('privacy')" class="hover:underline">Privacy Policy</button>
            <span>•</span>
            <button onclick="openModal('imprint')" class="hover:underline">Impressum</button>
            <span class="text-[11px] font-semibold text-brand-600 dark:text-brand-400">v6.4</span>
        </div>
        <p class="mt-1">© 2026 Indiaca Turnier Manager</p>
    </footer>

    <!-- Modals für Impressum & Datenschutz -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-lg w-full p-6 shadow-2xl relative text-gray-800 dark:text-gray-100">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // =====================================================================
        // PROZESSSCHRITT 1: KONFIGURATION, INITIAL STATE & THEME-STEUERUNG
        // =====================================================================
        const SUPABASE_URL = 'https://tmwbxykmzmhoszmvxpxe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LEgAIw7A8z6Ad773wrfetw_b2Z0NruV';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let state = {
            currentScreen: 'loading', // 'auth', 'main', 'tournaments', 'create-tournament', 'detail-tournament', 'profile', 'clubs-teams', 'edit-club', 'edit-team'
            clubsTab: 'mine',
            clubSortBy: 'name', // 'name' | 'city' | 'zip'
            clubSortDir: 'asc', // 'asc' | 'desc'
            currentUser: null,
            activeTournamentId: null,
            activeClubId: null,
            activeTeamId: null,
            darkMode: localStorage.getItem('vtm_dark') === 'true',
            tournaments: [],
            clubs: [],
            teams: [],
            profiles: []
        };

        const AVATARS = [
            '<svg class="w-full h-full text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M15 2.1c-1.4 1.8-1.4 4 0 5.8"/><path d="M9 21.9c1.4-1.8 1.4-4 0-5.8"/><path d="M2.1 15c1.8-1.4 4-1.4 5.8 0"/><path d="M21.9 9c-1.8 1.4-4 1.4-5.8 0"/></svg>',
            '<svg class="w-full h-full text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6h-8m0 0H4M12 6v14"/><path d="M4 10h16"/><path d="M4 14h16"/><path d="M4 18h16"/></svg>',
            '<svg class="w-full h-full text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
            '<svg class="w-full h-full text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            '<svg class="w-full h-full text-teal-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18.5 11a4.5 4.5 0 1 0-9 0"/><path d="M10 11v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-6"/></svg>',
            '<svg class="w-full h-full text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.7 15.2c-.4.4-.7 1-.7 1.5l1.6 3.3c.3.6 1 1 1.7 1h13.1c.7 0 1.4-.4 1.7-1l1.6-3.3c0-.5-.3-1-.7-1.5z"/></svg>',
            '<svg class="w-full h-full text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
            '<svg class="w-full h-full text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47"/></svg>',
            '<svg class="w-full h-full text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>'
        ];

        function applyTheme() {
            if (state.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            localStorage.setItem('vtm_dark', state.darkMode);
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            applyTheme();
            render();
        }

        function renderThemeToggle() {
            return `
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center gap-2 text-xs font-medium">
                    ${state.darkMode ? '☀️ Day' : '🌙 Night'}
                </button>
            `;
        }

        // =====================================================================
        // PROZESSSCHRITT 2: DATENLADEN, ROLLENPRÜFUNG & SORTIER-HILFSFUNKTIONEN
        // =====================================================================
        async function initApp() {
            applyTheme();
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session) {
                await loadUserData(session.user);
                await loadAllProfiles();
                await loadTournaments();
                await loadClubsAndTeams();
                state.currentScreen = 'main';
            } else {
                state.currentScreen = 'auth';
            }
            render();
        }

        async function loadUserData(authUser) {
            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', authUser.id).single();
            if (!profile) {
                const newProfile = { id: authUser.id, email: authUser.email, avatar_index: 0, nickname: authUser.email.split('@')[0] };
                await supabaseClient.from('profiles').insert([newProfile]);
                profile = newProfile;
            }
            state.currentUser = {
                id: authUser.id,
                email: authUser.email,
                nickname: profile.nickname || authUser.email.split('@')[0],
                selectedAvatarIndex: profile.avatar_index || 0,
                avatar: AVATARS[profile.avatar_index || 0]
            };
        }

        async function loadAllProfiles() {
            const { data } = await supabaseClient.from('profiles').select('*');
            state.profiles = data || [];
        }

        function getNickname(email) {
            if (!email) return '';
            const p = state.profiles.find(item => item.email === email);
            return p && p.nickname ? p.nickname : email.split('@')[0];
        }

        async function loadTournaments() {
            const { data, error } = await supabaseClient.from('tournaments').select('*');
            if (!error) state.tournaments = data || [];
        }

        async function loadClubsAndTeams() {
            const { data: clubsData } = await supabaseClient.from('clubs').select('*');
            const { data: teamsData } = await supabaseClient.from('teams').select('*');
            state.clubs = clubsData || [];
            state.teams = teamsData || [];
        }

        // Prüft, ob der aktuelle Nutzer ClubManager oder TeamCoach ist
        function canCreateTournament() {
            if (!state.currentUser) return false;
            const email = state.currentUser.email;
            const isClubManager = state.clubs.some(c => Array.isArray(c.managers) && c.managers.includes(email));
            const isTeamCoach = state.teams.some(t => Array.isArray(t.coaches) && t.coaches.includes(email));
            return isClubManager || isTeamCoach;
        }

        // Prüft, ob der Nutzer einem Verein als Mitglied oder Manager angehört
        function isUserClubMemberOrManager(club) {
            if (!state.currentUser || !club) return false;
            const email = state.currentUser.email;
            return (Array.isArray(club.members) && club.members.includes(email)) ||
                   (Array.isArray(club.managers) && club.managers.includes(email));
        }

        // Sortiert Vereine nach Name, Stadt oder PLZ
        function getSortedClubs(clubList) {
            const factor = state.clubSortDir === 'asc' ? 1 : -1;
            return [...clubList].sort((a, b) => {
                if (state.clubSortBy === 'zip') {
                    const zipA = parseInt((a.zip_code || '').replace(/\D/g, ''), 10);
                    const zipB = parseInt((b.zip_code || '').replace(/\D/g, ''), 10);
                    if (!isNaN(zipA) && !isNaN(zipB) && zipA !== zipB) {
                        return (zipA - zipB) * factor;
                    }
                    return String(a.zip_code || '').localeCompare(String(b.zip_code || ''), 'de', { numeric: true }) * factor;
                }
                if (state.clubSortBy === 'city') {
                    return String(a.city || '').localeCompare(String(b.city || ''), 'de', { sensitivity: 'base' }) * factor;
                }
                return String(a.name || '').localeCompare(String(b.name || ''), 'de', { sensitivity: 'base' }) * factor;
            });
        }

        function setClubSort(sortBy) {
            if (state.clubSortBy === sortBy) {
                state.clubSortDir = state.clubSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.clubSortBy = sortBy;
                state.clubSortDir = 'asc';
            }
            render();
        }

        // =====================================================================
        // PROZESSSCHRITT 3: RENDER-ENGINE & HEADER-KOMPONENTE
        // =====================================================================
        function render() {
            const app = document.getElementById('app');

            switch (state.currentScreen) {
                case 'auth':
                    app.innerHTML = renderAuthScreen();
                    break;
                case 'main':
                    app.innerHTML = renderMainScreen();
                    break;
                case 'tournaments':
                    app.innerHTML = renderTournamentsScreen();
                    break;
                case 'create-tournament':
                    app.innerHTML = renderTournamentForm(null);
                    break;
                case 'detail-tournament':
                    const t = state.tournaments.find(item => item.id === state.activeTournamentId);
                    app.innerHTML = renderTournamentForm(t);
                    break;
                case 'profile':
                    app.innerHTML = renderProfileScreen();
                    break;
                case 'clubs-teams':
                    app.innerHTML = renderClubsAndTeamsScreen();
                    break;
                case 'edit-club':
                    app.innerHTML = renderClubFormScreen();
                    break;
                case 'edit-team':
                    app.innerHTML = renderTeamFormScreen();
                    break;
            }
        }

        function renderAppHeader(titleText, showBackToMain = false) {
            const allowTournamentCreate = canCreateTournament();
            return `
                <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex flex-wrap justify-between items-center gap-3 shadow-sm w-full rounded-2xl">
                    <div class="flex flex-wrap items-center gap-2">
                        ${showBackToMain ? `<button onclick="goToMain()" class="px-3 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200">&larr; Vereine-Start</button>` : ''}
                        <span class="font-bold text-sm px-2">${titleText}</span>
                        ${renderThemeToggle()}
                        <button onclick="goToClubsAndTeams()" class="px-3 py-2 text-xs bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-brand-400 font-medium rounded-xl">Vereine & Teams verwalten</button>
                        <button onclick="goToTournaments()" class="px-3 py-2 text-xs bg-gray-100 dark:bg-gray-700 rounded-xl font-medium">Turniere</button>
                        <button onclick="goToProfile()" class="px-3 py-2 text-xs bg-gray-100 dark:bg-gray-700 rounded-xl font-medium">Profil</button>
                        ${allowTournamentCreate ? `<button onclick="goToCreateTournament()" class="px-3 py-2 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium shadow">+ Turnier</button>` : ''}
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden border flex items-center justify-center">
                            ${state.currentUser.avatar}
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-500 dark:text-gray-400">Angemeldet als</span>
                            <span class="font-semibold text-xs text-gray-800 dark:text-gray-100">${state.currentUser.nickname}</span>
                        </div>
                        <button onclick="logout()" class="ml-1 px-3 py-1.5 text-xs bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-medium transition">Abmelden</button>
                    </div>
                </header>
            `;
        }

        // =====================================================================
        // PROZESSSCHRITT 4: HAUPTSEITE (VEREINE-HUB MIT EIGENEN & PUBLIZIERTEN VEREINEN)
        // =====================================================================
        function renderClubCard(c, isOwnSection = false) {
            const isMember = c.members && c.members.includes(state.currentUser.email);
            const isManager = c.managers && c.managers.includes(state.currentUser.email);
            const isPending = c.pending_members && c.pending_members.includes(state.currentUser.email);
            const clubTeams = state.teams.filter(t => t.club_id === c.id);
            const showTeams = isMember || isManager;

            return `
                <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border ${isOwnSection ? 'border-brand-300 dark:border-brand-700' : 'border-gray-200 dark:border-gray-700'} shadow-sm space-y-4">
                    <div class="flex flex-wrap justify-between items-start gap-4">
                        <div class="flex items-start gap-4">
                            ${c.logo_url
                                ? `<img src="${c.logo_url}" alt="Logo ${c.name}" class="w-14 h-14 object-cover rounded-xl border shrink-0">`
                                : `<div class="w-14 h-14 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-xs font-bold text-gray-400 shrink-0">LOGO</div>`
                            }
                            <div class="space-y-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-bold text-base">${c.name}</h3>
                                    ${isManager ? `<span class="text-[11px] bg-brand-100 text-brand-800 px-2 py-0.5 rounded-full font-medium">Manager</span>` : ''}
                                    ${!isManager && isMember ? `<span class="text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">ClubMember</span>` : ''}
                                </div>
                                <p class="text-xs text-gray-500">📍 ${c.zip_code || '-'} ${c.city || ''}</p>
                                ${c.website_url ? `<p class="text-xs"><a href="${c.website_url}" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:underline">🌐 Vereins-Homepage</a></p>` : ''}
                                <p class="text-[11px] text-gray-500">Manager: ${(c.managers || []).map(m => getNickname(m)).join(', ') || '-'}</p>
                            </div>
                        </div>
                        <div>
                            ${(isManager || isMember) ? `
                                <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">Mitglied</span>
                            ` : isPending ? `
                                <span class="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-medium">Anfrage ausstehend</span>
                            ` : `
                                <button onclick="requestClubJoin('${c.id}')" class="text-xs px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow font-medium transition">Beitritt anfragen</button>
                            `}
                        </div>
                    </div>

                    ${showTeams ? `
                        <div class="border-t border-gray-100 dark:border-gray-700 pt-3 space-y-2">
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Teams im Verein (${clubTeams.length})</h4>
                            ${clubTeams.length === 0 ? `<p class="text-xs text-gray-400 italic">Noch keine Teams in diesem Verein angelegt.</p>` : `
                                <div class="grid gap-2">
                                    ${clubTeams.map(t => {
                                        const isTeamMember = t.members && t.members.includes(state.currentUser.email);
                                        const isTeamCoach = t.coaches && t.coaches.includes(state.currentUser.email);
                                        const isTeamPending = t.pending_members && t.pending_members.includes(state.currentUser.email);
                                        return `
                                            <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                                                <div>
                                                    <span class="font-semibold text-sm">${t.name}</span>
                                                    <span class="text-xs text-gray-500 block">${t.description || 'Keine Beschreibung'}</span>
                                                    <span class="text-[10px] text-emerald-600">Coach: ${(t.coaches || []).map(co => getNickname(co)).join(', ')}</span>
                                                </div>
                                                <div>
                                                    ${(isTeamCoach || isTeamMember) ? `
                                                        <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg font-medium">Dabei</span>
                                                    ` : isTeamPending ? `
                                                        <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg font-medium">Anfrage läuft</span>
                                                    ` : `
                                                        <button onclick="requestTeamJoin('${t.id}')" class="text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg shadow font-medium">Team-Beitritt anfragen</button>
                                                    `}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderSortControls() {
            const arrow = (field) => state.clubSortBy === field ? (state.clubSortDir === 'asc' ? '↑' : '↓') : '↕';
            return `
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="text-gray-500 font-medium">Sortieren:</span>
                    <button onclick="setClubSort('name')" class="px-3 py-1.5 rounded-xl border ${state.clubSortBy === 'name' ? 'bg-brand-600 text-white border-brand-600' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'} font-medium transition">
                        Name ${arrow('name')}
                    </button>
                    <button onclick="setClubSort('city')" class="px-3 py-1.5 rounded-xl border ${state.clubSortBy === 'city' ? 'bg-brand-600 text-white border-brand-600' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'} font-medium transition">
                        Stadt ${arrow('city')}
                    </button>
                    <button onclick="setClubSort('zip')" class="px-3 py-1.5 rounded-xl border ${state.clubSortBy === 'zip' ? 'bg-brand-600 text-white border-brand-600' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700'} font-medium transition">
                        PLZ ${arrow('zip')}
                    </button>
                </div>
            `;
        }

        function renderMainScreen() {
            const publishedClubs = state.clubs.filter(c => c.is_published === true);
            const ownClubs = getSortedClubs(state.clubs.filter(c => isUserClubMemberOrManager(c)));
            const otherPublishedClubs = getSortedClubs(
                publishedClubs.filter(c => !isUserClubMemberOrManager(c))
            );
            const allPublishedSorted = getSortedClubs(publishedClubs);

            return `
                <div class="space-y-6 w-full">
                    ${renderAppHeader('Vereine entdecken', false)}

                    <main class="w-full space-y-8">
                        ${ownClubs.length > 0 ? `
                            <!-- EIGENE VEREINE (WENN MINDESTENS EIN VEREIN ZUGEORDNET IST) -->
                            <section class="space-y-4">
                                <div class="flex justify-between items-center">
                                    <h2 class="text-xl font-bold">Deine Vereine</h2>
                                    <span class="text-xs text-gray-500">${ownClubs.length} Verein(e)</span>
                                </div>
                                <div class="grid gap-4">
                                    ${ownClubs.map(c => renderClubCard(c, true)).join('')}
                                </div>
                            </section>

                            <!-- WEITERE PUBLIZIERTE VEREINE MIT SORTIERUNG -->
                            <section class="space-y-4">
                                <div class="flex flex-wrap justify-between items-center gap-3">
                                    <h2 class="text-xl font-bold">Weitere veröffentlichte Vereine</h2>
                                    ${renderSortControls()}
                                </div>
                                <div class="grid gap-4">
                                    ${otherPublishedClubs.length === 0
                                        ? `<p class="text-xs text-gray-500">Keine weiteren veröffentlichten Vereine vorhanden.</p>`
                                        : otherPublishedClubs.map(c => renderClubCard(c, false)).join('')
                                    }
                                </div>
                            </section>
                        ` : `
                            <!-- DEFAULT FÜR NEUE NUTZER: ALLE VERÖFFENTLICHTEN VEREINE MIT SORTIERUNG -->
                            <section class="space-y-4">
                                <div class="bg-brand-50 dark:bg-brand-900/20 border border-brand-200 dark:border-brand-800 rounded-2xl p-4 text-xs text-brand-900 dark:text-brand-200">
                                    Willkommen! Hier findest du alle veröffentlichten Vereine. Stelle eine Beitrittsanfrage bei einem Verein, um dessen Teams zu sehen und Team-Mitgliedschaften anzufragen.
                                </div>
                                <div class="flex flex-wrap justify-between items-center gap-3">
                                    <h2 class="text-xl font-bold">Veröffentlichte Vereine</h2>
                                    ${renderSortControls()}
                                </div>
                                <div class="grid gap-4">
                                    ${allPublishedSorted.length === 0
                                        ? `<p class="text-xs text-gray-500">Derzeit sind keine veröffentlichten Vereine vorhanden.</p>`
                                        : allPublishedSorted.map(c => renderClubCard(c, false)).join('')
                                    }
                                </div>
                            </section>
                        `}
                    </main>
                </div>
            `;
        }

        // =====================================================================
        // PROZESSSCHRITT 5: TURNIERE, PROFIL, VEREINS- & TEAM-FORMULARE
        // =====================================================================
        function renderAuthScreen() {
            return `
                <div class="flex justify-end p-4 w-full">${renderThemeToggle()}</div>
                <div class="flex-grow flex items-center justify-center w-full">
                    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 space-y-6">
                        <div class="text-center space-y-2">

        // =====================================================================
        // PROZESSSCHRITT 6: CONTROLLER-AKTIONEN, AUTH & DATENBANK-SCHREIBLOGIK
        // =====================================================================
        async function loginWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
        }

        function handleLoginClick() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben.");
            loginWithEmail(email, password);
        }

        function handleRegisterClick() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben.");
            registerWithEmail(email, password);
        }

        async function registerWithEmail(email, password) {
            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { emailRedirectTo: window.location.origin + window.location.pathname }
            });
            if (error) return alert("Registrierung fehlgeschlagen: " + error.message);
            alert("Registrierung erfolgreich! Bitte logge dich ein.");
            return data;
        }

        async function loginWithEmail(email, password) {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) return alert("Login fehlgeschlagen: " + error.message);
            await initApp();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            state.currentUser = null;
            state.currentScreen = 'auth';
            render();
        }

        function goToMain() { state.currentScreen = 'main'; render(); }
        function goToTournaments() { state.currentScreen = 'tournaments'; render(); }
        function goToCreateTournament() {
            if (!canCreateTournament()) return alert("Nur ClubManager oder TeamCoach dürfen Turniere anlegen.");
            state.currentScreen = 'create-tournament';
            render();
        }
        function goToProfile() { state.currentScreen = 'profile'; render(); }
        function goToClubsAndTeams() { state.currentScreen = 'clubs-teams'; render(); }
        function openTournament(id) { state.activeTournamentId = id; state.currentScreen = 'detail-tournament'; render(); }

        function selectAvatar(idx) {
            document.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('border-brand-600', 'bg-brand-50'));
            document.getElementById(`avatar-${idx}`).classList.add('border-brand-600', 'bg-brand-50');
            state.currentUser.tempAvatarIndex = idx;
        }

        // Bugfix: Nickname-Änderung auch in state.profiles nachführen
        async function saveProfile() {
            const newNickname = document.getElementById('profile-nickname').value.trim();
            if (!newNickname) return alert("Bitte einen Nickname eingeben.");
            const updateData = { nickname: newNickname };

            if (state.currentUser.tempAvatarIndex !== undefined) {
                const idx = state.currentUser.tempAvatarIndex;
                updateData.avatar_index = idx;
                state.currentUser.selectedAvatarIndex = idx;
                state.currentUser.avatar = AVATARS[idx];
            }

            const { error } = await supabaseClient.from('profiles').update(updateData).eq('id', state.currentUser.id);
            if (error) return alert("Fehler beim Speichern des Profils: " + error.message);

            state.currentUser.nickname = newNickname;
            const existingProfile = state.profiles.find(p => p.email === state.currentUser.email || p.id === state.currentUser.id);
            if (existingProfile) {
                existingProfile.nickname = newNickname;
                if (updateData.avatar_index !== undefined) existingProfile.avatar_index = updateData.avatar_index;
            }
            goToMain();
        }

        async function handleSaveTournament(e, id) {
            e.preventDefault();
            if (!canCreateTournament()) return alert("Nur ClubManager oder TeamCoach dürfen Turniere speichern.");

            const name = document.getElementById('t-name').value;
            const sport_type = document.getElementById('t-sport').value;
            const registration_deadline = document.getElementById('t-deadline').value;
            const address = document.getElementById('t-address').value;
            const details = document.getElementById('t-details').value;
            const is_published = document.getElementById('t-published').checked;

            if (id) {
                await supabaseClient.from('tournaments').update({ name, sport_type, registration_deadline, address, details, is_published }).eq('id', id);
            } else {
                await supabaseClient.from('tournaments').insert([{
                    name, sport_type, registration_deadline, address, details, is_published,
                    created_by: state.currentUser.id,
                    admins: [state.currentUser.email]
                }]);
            }
            await loadTournaments();
            goToTournaments();
        }

        function openClubForm(clubId) {
            state.activeClubId = clubId;
            state.currentScreen = 'edit-club';
            render();
        }

        function openTeamForm(teamId) {
            if (!teamId && state.clubs.length === 0) return alert("Du musst zuerst einen Verein anlegen!");
            state.activeTeamId = teamId;
            state.currentScreen = 'edit-team';
            render();
        }

        async function saveClubForm(e) {
            e.preventDefault();
            const name = document.getElementById('club-name').value;
            const zip_code = document.getElementById('club-zip').value;
            const city = document.getElementById('club-city').value;
            const website_url = document.getElementById('club-website').value;
            let logo_url = document.getElementById('club-logo-url').value;

            const fileInput = document.getElementById('club-logo-file');
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const fileName = `logo_${Date.now()}_${file.name}`;
                const { error } = await supabaseClient.storage.from('club-logos').upload(fileName, file);
                if (!error) {
                    const { data: publicUrlData } = supabaseClient.storage.from('club-logos').getPublicUrl(fileName);
                    logo_url = publicUrlData.publicUrl;
                }
            }

            if (state.activeClubId) {
                await supabaseClient.from('clubs').update({ name, zip_code, city, website_url, logo_url }).eq('id', state.activeClubId);
            } else {
                await supabaseClient.from('clubs').insert([{
                    name, zip_code, city, website_url, logo_url,
                    created_by: state.currentUser.id,
                    managers: [state.currentUser.email],
                    members: []
                }]);
            }

            await loadClubsAndTeams();
            goToClubsAndTeams();
        }

        async function saveTeamForm(e) {
            e.preventDefault();
            const name = document.getElementById('team-name').value;
            const description = document.getElementById('team-desc').value;
            const club_id = document.getElementById('team-club-id').value;

            if (state.activeTeamId) {
                await supabaseClient.from('teams').update({ name, description, club_id }).eq('id', state.activeTeamId);
            } else {
                await supabaseClient.from('teams').insert([{
                    name, description, club_id,
                    created_by: state.currentUser.id,
                    coaches: [state.currentUser.email],
                    members: []
                }]);
            }

            await loadClubsAndTeams();
            goToClubsAndTeams();
        }

        async function handleDeleteClub(clubId) {
            if (!confirm("Möchtest du diesen Verein wirklich löschen?")) return;
            await supabaseClient.from('clubs').delete().eq('id', clubId);
            await loadClubsAndTeams();
            render();
        }

        async function handleDeleteTeam(teamId) {
            if (!confirm("Möchtest du dieses Team wirklich löschen?")) return;
            await supabaseClient.from('teams').delete().eq('id', teamId);
            await loadClubsAndTeams();
            render();
        }

        async function requestClubJoin(clubId) {
            const club = state.clubs.find(c => c.id === clubId);
            if (!club) return;
            const pending = [...new Set([...(club.pending_members || []), state.currentUser.email])];
            await supabaseClient.from('clubs').update({ pending_members: pending }).eq('id', clubId);
            alert("Beitrittsanfrage gesendet!");
            await loadClubsAndTeams();
            render();
        }

        async function acceptClubMember(clubId, email) {
            const club = state.clubs.find(c => c.id === clubId);
            if (!club) return;
            const pending = (club.pending_members || []).filter(e => e !== email);
            const members = [...new Set([...(club.members || []), email])];
            await supabaseClient.from('clubs').update({ pending_members: pending, members }).eq('id', clubId);
            await loadClubsAndTeams();
            render();
        }

        async function requestTeamJoin(teamId) {
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;
            const pending = [...new Set([...(team.pending_members || []), state.currentUser.email])];
            await supabaseClient.from('teams').update({ pending_members: pending }).eq('id', teamId);
            alert("Team-Beitrittsanfrage gesendet!");
            await loadClubsAndTeams();
            render();
        }

        async function acceptTeamMember(teamId, email) {
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;
            const pending = (team.pending_members || []).filter(e => e !== email);
            const members = [...new Set([...(team.members || []), email])];
            await supabaseClient.from('teams').update({ pending_members: pending, members }).eq('id', teamId);
            await loadClubsAndTeams();
            render();
        }

        async function toggleClubPublish(clubId, targetState) {
            await supabaseClient.from('clubs').update({ is_published: targetState }).eq('id', clubId);
            await loadClubsAndTeams();
            render();
        }

        async function handleAddManagerPrompt(clubId) {
            const newEmail = prompt("E-Mail-Adresse des neuen Vereinsmanagers:");
            if (!newEmail) return;
            const club = state.clubs.find(c => c.id === clubId);
            if (!club) return;
            const updatedManagers = [...new Set([...(club.managers || []), newEmail])];
            await supabaseClient.from('clubs').update({ managers: updatedManagers }).eq('id', clubId);
            await loadClubsAndTeams();
            render();
        }

        function openModal(type) {
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = type === 'privacy' ? '<h3>Datenschutz</h3>' : '<h3>Impressum</h3>';
        }

        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
