    <!-- ==========================================
         APP CONTAINER & ROUTING (Single Page Render)
         ========================================== -->

        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
    </div>

         GLOBAL FOOTER (Mit Version & Impressum)
         ========================================== -->

            <button onclick="openModal('privacy')" class="hover:underline">Privacy Policy</button>
            <span>•</span>
            <button onclick="openModal('imprint')" class="hover:underline">Impressum</button>

            <span class="font-semibold text-brand-600 dark:text-brand-400">v6</span>
        </div>
        <p class="mt-1">© 2026 Indiaca Turnier Manager</p>
    </footer>

    <!-- Modals für Impressum & Datenschutz -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-lg w-full p-6 shadow-2xl relative text-gray-800 dark:text-gray-100">

            <div id="modal-content"></div>

    <!-- ==========================================
         JAVASCRIPT LOGIK & SUPABASE INTEGRATION
         ========================================== -->
    <script>
        // =========================================================================
        // PROZESSSCHRITT 1: CONFIGURATION & INITIAL STATE
        // =========================================================================
        const SUPABASE_URL = 'https://tmwbxykmzmhoszmvxpxe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LEgAIw7A8z6Ad773wrfetw_b2Z0NruV';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let state = {
            currentScreen: 'loading', // 'auth', 'main', 'create-tournament', 'detail-tournament', 'profile', 'clubs-teams'
            currentUser: null, 
            activeTournamentId: null, 
            darkMode: localStorage.getItem('vtm_dark') === 'true',

            clubs: [],

        };

        const AVATARS = [

            '<svg class="w-full h-full text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>'
        ];

        // --- Theme handling ---
        function applyTheme() {
            if (state.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            localStorage.setItem('vtm_dark', state.darkMode);
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            applyTheme();
            render();
        }

        function renderThemeToggle() {
            return `
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center gap-2 text-xs font-medium">
                    ${state.darkMode ? '☀️ Day' : '🌙 Night'}
                </button>
            `;
        }

        // =========================================================================
        // PROZESSSCHRITT 2: RENDER ENGINE & COMPONENT TEMPLATES
        // =========================================================================
        async function initApp() {
            applyTheme();
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                await loadUserData(session.user);
                await loadTournaments();
                await loadClubsAndTeams();
                state.currentScreen = 'main';
            } else {
                state.currentScreen = 'auth';
            }
            render();
        }

        async function loadUserData(authUser) {
            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', authUser.id).single();
            if (!profile) {
                const newProfile = { id: authUser.id, email: authUser.email, avatar_index: 0, nickname: authUser.email.split('@')[0] };
                await supabaseClient.from('profiles').insert([newProfile]);
                profile = newProfile;
            }
            state.currentUser = {
                id: authUser.id,
                email: authUser.email,
                nickname: profile.nickname || authUser.email.split('@')[0],
                selectedAvatarIndex: profile.avatar_index || 0,
                avatar: AVATARS[profile.avatar_index || 0]
            };
        }

        async function loadTournaments() {
            const { data, error } = await supabaseClient.from('tournaments').select('*');
            if (!error) state.tournaments = data || [];
        }

        async function loadClubsAndTeams() {
            const { data: clubsData } = await supabaseClient.from('clubs').select('*');
            const { data: teamsData } = await supabaseClient.from('teams').select('*');
            state.clubs = clubsData || [];
            state.teams = teamsData || [];
        }

        function render() {
            const app = document.getElementById('app');
            app.className = "flex-grow flex flex-col justify-between w-full max-w-5xl";
            
            switch(state.currentScreen) {
                case 'auth':
                    app.innerHTML = renderAuthScreen();
                    break;
                case 'main':
                    app.innerHTML = renderMainScreen();
                    break;
                case 'create-tournament':
                    app.innerHTML = renderTournamentForm(null);
                    break;
                case 'detail-tournament':
                    const t = state.tournaments.find(item => item.id === state.activeTournamentId);
                    app.innerHTML = renderTournamentForm(t);
                    break;
                case 'profile':
                    app.innerHTML = renderProfileScreen();
                    break;
                case 'clubs-teams':
                    app.innerHTML = renderClubsAndTeamsScreen();
                    break;
            }
        }

        // --- 2.1 Screens ---
        
        function renderAuthScreen() {
            return `
                <div class="flex justify-end p-4 w-full">${renderThemeToggle()}</div>
                <div class="flex-grow flex items-center justify-center w-full">
                    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 space-y-6">
                        <div class="text-center space-y-2">
                            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Indiaca Turnier Manager</h1>
                            <p class="text-sm text-gray-600 dark:text-gray-300">Echte Cloud-Synchronisation für Turniere und Vereine.</p>
                        </div>
                        
                        <!-- Formular: E-Mail & Passwort -->
                        <div class="space-y-3 pt-2">
                            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400">Mit E-Mail anmelden oder registrieren</label>
                            <input type="email" id="emailInput" placeholder="E-Mail-Adresse" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                            <input type="password" id="passwordInput" placeholder="Passwort" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                            
                            <div class="flex gap-2 pt-1">
                                <button onclick="handleLoginClick()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-xl text-sm font-medium transition shadow-sm">Einloggen</button>
                                <button onclick="handleRegisterClick()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded-xl text-sm font-medium transition shadow-sm">Registrieren</button>
                            </div>
                        </div>

                            <span class="flex-shrink mx-4 text-xs text-gray-400">ODER</span>
                            <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
