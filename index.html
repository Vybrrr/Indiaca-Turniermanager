<!DOCTYPE html>
<html lang="de" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnier Manager - v6</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">

    <!-- ==========================================
         APP CONTAINER & ROUTING (Single Page Render)
         ========================================== -->
    <div id="app" class="flex-grow flex flex-col items-center justify-center p-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
    </div>

    <!-- ==========================================
         GLOBAL FOOTER (Mit Version & Impressum)
         ========================================== -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-4 text-center text-xs text-gray-500 dark:text-gray-400 transition-colors duration-200 w-full">
        <div class="space-x-4">
            <button onclick="openModal('privacy')" class="hover:underline">Privacy Policy</button>
            <span>•</span>
            <button onclick="openModal('imprint')" class="hover:underline">Impressum</button>
            <span>•</span>
            <span class="font-semibold text-brand-600 dark:text-brand-400">v6.1</span>
        </div>
        <p class="mt-1">© 2026 Indiaca Turnier Manager</p>
    </footer>

    <!-- Modals für Impressum & Datenschutz -->
    <div id="modal-container" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-lg w-full p-6 shadow-2xl relative text-gray-800 dark:text-gray-100">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT LOGIK & SUPABASE INTEGRATION
         ========================================== -->
    <script>
        // =========================================================================
        // PROZESSSCHRITT 1: CONFIGURATION & INITIAL STATE
        // =========================================================================
        const SUPABASE_URL = 'https://tmwbxykmzmhoszmvxpxe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LEgAIw7A8z6Ad773wrfetw_b2Z0NruV';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let state = {
            currentScreen: 'loading', // 'auth', 'main', 'create-tournament', 'detail-tournament', 'profile', 'clubs-teams'
            currentUser: null, 
            activeTournamentId: null, 
            darkMode: localStorage.getItem('vtm_dark') === 'true',
            tournaments: [],
            clubs: [],
            teams: [],
            profiles: []
        };

        const AVATARS = [
            '<svg class="w-full h-full text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M15 2.1c-1.4 1.8-1.4 4 0 5.8"/><path d="M9 21.9c1.4-1.8 1.4-4 0-5.8"/><path d="M2.1 15c1.8-1.4 4-1.4 5.8 0"/><path d="M21.9 9c-1.8 1.4-4 1.4-5.8 0"/></svg>',
            '<svg class="w-full h-full text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6h-8m0 0H4M12 6v14"/><path d="M4 10h16"/><path d="M4 14h16"/><path d="M4 18h16"/></svg>',
            '<svg class="w-full h-full text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
            '<svg class="w-full h-full text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            '<svg class="w-full h-full text-teal-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18.5 11a4.5 4.5 0 1 0-9 0"/><path d="M10 11v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-6"/></svg>',
            '<svg class="w-full h-full text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.7 15.2c-.4.4-.7 1-.7 1.5l1.6 3.3c.3.6 1 1 1.7 1h13.1c.7 0 1.4-.4 1.7-1l1.6-3.3c0-.5-.3-1-.7-1.5z"/></svg>',
            '<svg class="w-full h-full text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
            '<svg class="w-full h-full text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47"/></svg>',
            '<svg class="w-full h-full text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>'
        ];

        // --- Theme handling ---
        function applyTheme() {
            if (state.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            localStorage.setItem('vtm_dark', state.darkMode);
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            applyTheme();
            render();
        }

        function renderThemeToggle() {
            return `
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center gap-2 text-xs font-medium">
                    ${state.darkMode ? '☀️ Day' : '🌙 Night'}
                </button>
            `;
        }

        // =========================================================================
        // PROZESSSCHRITT 2: RENDER ENGINE & COMPONENT TEMPLATES
        // =========================================================================
        async function initApp() {
            applyTheme();
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                await loadUserData(session.user);
                await loadAllProfiles(); 
                await loadTournaments();
                await loadClubsAndTeams();
                state.currentScreen = 'main';
            } else {
                state.currentScreen = 'auth';
            }
            render();
        }

        async function loadUserData(authUser) {
            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', authUser.id).single();
            if (!profile) {
                const newProfile = { id: authUser.id, email: authUser.email, avatar_index: 0, nickname: authUser.email.split('@')[0] };
                await supabaseClient.from('profiles').insert([newProfile]);
                profile = newProfile;
            }
            state.currentUser = {
                id: authUser.id,
                email: authUser.email,
                nickname: profile.nickname || authUser.email.split('@')[0],
                selectedAvatarIndex: profile.avatar_index || 0,
                avatar: AVATARS[profile.avatar_index || 0]
            };
        }

        async function loadTournaments() {
            const { data, error } = await supabaseClient.from('tournaments').select('*');
            if (!error) state.tournaments = data || [];
        }

        async function loadClubsAndTeams() {
            const { data: clubsData } = await supabaseClient.from('clubs').select('*');
            const { data: teamsData } = await supabaseClient.from('teams').select('*');
            state.clubs = clubsData || [];
            state.teams = teamsData || [];
        }

        function render() {
            const app = document.getElementById('app');
            app.className = "flex-grow flex flex-col justify-between w-full max-w-5xl";
            
            switch(state.currentScreen) {
                case 'auth':
                    app.innerHTML = renderAuthScreen();
                    break;
                case 'main':
                    app.innerHTML = renderMainScreen();
                    break;
                case 'create-tournament':
                    app.innerHTML = renderTournamentForm(null);
                    break;
                case 'detail-tournament':
                    const t = state.tournaments.find(item => item.id === state.activeTournamentId);
                    app.innerHTML = renderTournamentForm(t);
                    break;
                case 'profile':
                    app.innerHTML = renderProfileScreen();
                    break;
                case 'clubs-teams':
                    app.innerHTML = renderClubsAndTeamsScreen();
                    break;
            }
        }

        // --- 2.1 Screens ---
        
        function renderAuthScreen() {
            return `
                <div class="flex justify-end p-4 w-full">${renderThemeToggle()}</div>
                <div class="flex-grow flex items-center justify-center w-full">
                    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 space-y-6">
                        <div class="text-center space-y-2">
                            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Indiaca Turnier Manager</h1>
                            <p class="text-sm text-gray-600 dark:text-gray-300">Echte Cloud-Synchronisation für Turniere und Vereine.</p>
                        </div>
                        
                        <!-- Formular: E-Mail & Passwort -->
                        <div class="space-y-3 pt-2">
                            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400">Mit E-Mail anmelden oder registrieren</label>
                            <input type="email" id="emailInput" placeholder="E-Mail-Adresse" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                            <input type="password" id="passwordInput" placeholder="Passwort" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                            
                            <div class="flex gap-2 pt-1">
                                <button onclick="handleLoginClick()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-xl text-sm font-medium transition shadow-sm">Einloggen</button>
                                <button onclick="handleRegisterClick()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded-xl text-sm font-medium transition shadow-sm">Registrieren</button>
                            </div>
                        </div>

                        <!-- Trennlinie -->
                        <div class="relative flex py-2 items-center">
                            <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                            <span class="flex-shrink mx-4 text-xs text-gray-400">ODER</span>
                            <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                        </div>

                        <!-- Google OAuth Button -->
                        <div>
                            <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 transition">
                                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                                Mit Google ID anmelden
                            </button>
                        </div>
                    </div>
                </div>
                <div></div>
            `;
        }

        function renderMainScreen() {
            const userTournaments = state.tournaments.filter(t => 
                (t.admins && t.admins.includes(state.currentUser.email)) || 
                (t.guests && t.guests.includes(state.currentUser.email)) ||
                t.created_by === state.currentUser.id
            );

            return `
                <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex justify-between items-center shadow-sm w-full">
                    <div class="flex items-center gap-3">
                        ${renderThemeToggle()}
                        <button onclick="goToClubsAndTeams()" class="px-3 py-2 text-sm bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-brand-400 font-medium rounded-xl">Vereine & Teams</button>
                        <button onclick="goToProfile()" class="px-3 py-2 text-sm bg-gray-100 dark:bg-gray-700 rounded-xl">Profil</button>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden border flex items-center justify-center">
                            ${state.currentUser.avatar}
                        </div>
                        <div>
                            <span class="block text-xs text-gray-500 dark:text-gray-400">Angemeldet als</span>
                            <span class="font-semibold text-sm text-gray-800 dark:text-gray-100">${state.currentUser.nickname}</span>
                        </div>
                        <button onclick="logout()" class="ml-2 px-3 py-1.5 text-xs bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-medium transition">Abmelden</button>
                    </div>
                </header>
                <main class="w-full mx-auto p-6 flex-grow space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold">Deine Turniere</h2>
                        <button onclick="goToCreateTournament()" class="px-4 py-2 bg-brand-600 text-white font-medium rounded-xl shadow text-sm">+ Turnier erstellen</button>
                    </div>
                    <div class="grid gap-4">
                        ${userTournaments.map(t => `
                            <div onclick="openTournament('${t.id}')" class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm cursor-pointer flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-lg">${t.name} <span class="text-xs font-normal px-2 py-0.5 rounded ${t.is_published ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}">${t.is_published ? 'Publiziert' : 'Entwurf'}</span></h3>
                                    <p class="text-xs text-gray-500">Sportart: ${t.sport_type || 'Indiaca'} | 📍 ${t.address || 'Keine Adresse'}</p>
                                </div>
                                <span>&rarr;</span>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function renderTournamentForm(tournament = null) {
            const isEdit = tournament !== null;
            const currentSport = isEdit ? (tournament.sport_type || 'Indiaca') : 'Indiaca';
            
            return `
                <header class="bg-white dark:bg-gray-800 border-b px-6 py-4 flex justify-between items-center w-full">
                    <button onclick="goToMain()" class="text-sm font-medium">&larr; Zurück</button>
                    <span class="font-bold text-sm">${isEdit ? 'Turnier bearbeiten' : 'Neues Turnier'}</span>
                    ${renderThemeToggle()}
                </header>
                <main class="w-full max-w-2xl mx-auto p-6 flex-grow">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 border shadow-sm">
                        <form onsubmit="handleSaveTournament(event, '${isEdit ? tournament.id : ''}')" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold mb-1">Name des Turniers</label>
                                <input type="text" id="t-name" required value="${isEdit ? tournament.name : ''}" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Sportart</label>
                                <select id="t-sport" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 text-sm">
                                    <option value="Indiaca" ${currentSport === 'Indiaca' ? 'selected' : ''}>Indiaca</option>
                                    <option value="Volleyball" ${currentSport === 'Volleyball' ? 'selected' : ''}>Volleyball</option>
                                    <option value="Beachvolleyball" ${currentSport === 'Beachvolleyball' ? 'selected' : ''}>Beachvolleyball</option>
                                    <option value="Sonstige" ${currentSport === 'Sonstige' ? 'selected' : ''}>Sonstige</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Adresse / Halle</label>
                                <input type="text" id="t-address" value="${isEdit ? (tournament.address || '') : ''}" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Details / Beschreibung</label>
                                <textarea id="t-details" rows="3" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 text-sm">${isEdit ? (tournament.details || '') : ''}</textarea>
                            </div>
                            <div class="flex items-center gap-3 pt-2">
                                <input type="checkbox" id="t-published" ${isEdit && tournament.is_published ? 'checked' : ''} class="w-4 h-4 text-brand-600 rounded">
                                <label for="t-published" class="text-xs font-semibold">Turnier veröffentlichen (für alle sichtbar)</label>
                            </div>
                            <button type="submit" class="w-full py-3 bg-brand-600 text-white rounded-xl shadow font-medium text-sm">Speichern</button>
                        </form>
                    </div>
                </main>
            `;
        }

        function renderProfileScreen() {
            return `
                <header class="bg-white dark:bg-gray-800 border-b px-6 py-4 flex justify-between items-center w-full">
                    <button onclick="goToMain()" class="text-sm font-medium">&larr; Zurück</button>
                    <span class="font-bold text-sm">Profil bearbeiten</span>
                    ${renderThemeToggle()}
                </header>
                <main class="w-full max-w-md mx-auto p-6 flex-grow">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 border shadow-sm space-y-6">
                        <div>
                            <label class="block text-xs font-semibold mb-1">Dein Nickname</label>
                            <input type="text" id="profile-nickname" value="${state.currentUser.nickname || ''}" class="w-full px-4 py-2 border rounded-xl dark:bg-gray-700 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-2">Avatar wählen</label>
                            <div class="grid grid-cols-3 gap-3">
                                ${AVATARS.map((svg, idx) => `
                                    <div onclick="selectAvatar(${idx})" id="avatar-${idx}" class="avatar-opt cursor-pointer p-3 rounded-xl border-2 ${state.currentUser.selectedAvatarIndex === idx ? 'border-brand-600 bg-brand-50' : 'border-gray-200'} flex items-center justify-center h-16">
                                        ${svg}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <button onclick="saveProfile()" class="w-full py-3 bg-brand-600 text-white rounded-xl font-medium text-sm">Speichern</button>
                    </div>
                </main>
            `;
        }

        // =========================================================================
        // PROZESSSCHRITT 3: CONTROLLER ACTIONS & AUTHENTICATION LOGIC
        // =========================================================================
        
        async function loginWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({ 
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
        }

        function handleLoginClick() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert("Bitte E-Mail und Passwort eingeben.");
                return;
            }
            loginWithEmail(email, password);
        }

        function handleRegisterClick() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            if (!email || !password) {
                alert("Bitte E-Mail und Passwort eingeben.");
                return;
            }
            registerWithEmail(email, password);
        }

        async function registerWithEmail(email, password) {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + window.location.pathname
                }
            });

            if (error) {
                console.error("Fehler bei der Registrierung:", error.message);
                alert("Registrierung fehlgeschlagen: " + error.message);
                return;
            }

            alert("Registrierung erfolgreich! Bitte prüfe ggf. dein Postfach oder logge dich direkt ein.");
            return data;
        }

        async function loginWithEmail(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error("Fehler beim Login:", error.message);
                alert("Login fehlgeschlagen: " + error.message);
                return;
            }

            await initApp();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            state.currentUser = null;
            state.currentScreen = 'auth';
            render();
        }

        function goToMain() { state.currentScreen = 'main'; render(); }
        function goToCreateTournament() { state.currentScreen = 'create-tournament'; render(); }
        function goToProfile() { state.currentScreen = 'profile'; render(); }
        function openTournament(id) { state.activeTournamentId = id; state.currentScreen = 'detail-tournament'; render(); }

        function selectAvatar(idx) {
            document.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('border-brand-600', 'bg-brand-50'));
            document.getElementById(`avatar-${idx}`).classList.add('border-brand-600', 'bg-brand-50');
            state.currentUser.tempAvatarIndex = idx;
        }

        async function saveProfile() {
            const newNickname = document.getElementById('profile-nickname').value;
            const updateData = { nickname: newNickname };

            if (state.currentUser.tempAvatarIndex !== undefined) {
                const idx = state.currentUser.tempAvatarIndex;
                updateData.avatar_index = idx;
                state.currentUser.selectedAvatarIndex = idx;
                state.currentUser.avatar = AVATARS[idx];
            }

            await supabaseClient.from('profiles').update(updateData).eq('id', state.currentUser.id);
            state.currentUser.nickname = newNickname;
            goToMain();
        }

        async function handleSaveTournament(e, id) {
            e.preventDefault();
            const name = document.getElementById('t-name').value;
            const sport_type = document.getElementById('t-sport').value;
            const address = document.getElementById('t-address').value;
            const details = document.getElementById('t-details').value;
            const is_published = document.getElementById('t-published').checked;

            if (id) {
                await supabaseClient.from('tournaments').update({ name, sport_type, address, details, is_published }).eq('id', id);
            } else {
                await supabaseClient.from('tournaments').insert([{ 
                    name, sport_type, address, details, is_published, created_by: state.currentUser.id, admins: [state.currentUser.email] 
                }]);
            }
            await loadTournaments();
            goToMain();
        }

        function openModal(type) {
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = type === 'privacy' ? '<h3>Datenschutz</h3>' : '<h3>Impressum</h3>';
        }
    
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }

        // =========================================================================
        // PROZESSSCHRITT 4: VEREINE & TEAMS CONTROLLER & SCREENS
        // =========================================================================

        function goToClubsAndTeams() { state.currentScreen = 'clubs-teams'; render(); }

function renderClubsAndTeamsScreen() {
            const myClubs = state.clubs.filter(c => c.managers && c.managers.includes(state.currentUser.email));
            const myTeams = state.teams.filter(t => (t.coaches && t.coaches.includes(state.currentUser.email)) || (t.members && t.members.includes(state.currentUser.email)));

            return `
                <header class="bg-white dark:bg-gray-800 border-b px-6 py-4 flex justify-between items-center w-full">
                    <button onclick="goToMain()" class="text-sm font-medium">&larr; Zurück zum Hauptmenü</button>
                    <span class="font-bold text-sm">Vereine & Teams</span>
                    <div class="flex items-center gap-3">
                        ${renderThemeToggle()}
                        <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden border flex items-center justify-center">
                            ${state.currentUser.avatar}
                        </div>
                        <span class="text-sm font-semibold">${state.currentUser.nickname}</span>
                        <button onclick="logout()" class="ml-2 px-3 py-1.5 text-xs bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-medium transition">Abmelden</button>
                    </div>
                </header>
                <main class="w-full max-w-4xl mx-auto p-6 flex-grow space-y-8">
                    
                    <!-- VEREINE ABSCHNITT -->
                    <section class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold">Deine Vereine</h2>
                            <button onclick="handleCreateClub()" class="px-3 py-1.5 bg-brand-600 text-white text-xs font-medium rounded-xl shadow">+ Verein anlegen</button>
                        </div>
                        <div class="grid gap-3">
                            ${myClubs.length === 0 ? '<p class="text-xs text-gray-500">Du bist noch bei keinem Verein als Manager eingetragen.</p>' : ''}
                            ${myClubs.map(c => `
                                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border dark:border-gray-700 flex justify-between items-center">
                                    <div>
                                        <h3 class="font-bold text-sm">${c.name} <span class="text-xs font-normal px-2 py-0.5 rounded ${c.is_published ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}">${c.is_published ? 'Publiziert' : 'Entwurf'}</span></h3>
                                        <p class="text-xs text-gray-500">📍 ${c.zip_code || ''} ${c.city || ''}</p>
                                        <p class="text-[10px] text-brand-600 mt-1">Manager: ${c.managers.map(m => getNickname(m)).join(', ')}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="toggleClubPublish('${c.id}', ${!c.is_published})" class="text-xs px-2.5 py-1.5 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200">${c.is_published ? 'Verstecken' : 'Publizieren'}</button>
                                        <button onclick="handleEditClub('${c.id}')" class="text-xs px-2.5 py-1.5 bg-gray-100 dark:bg-gray-700 rounded-lg">Bearbeiten</button>
                                        <button onclick="handleDeleteClub('${c.id}')" class="text-xs px-2.5 py-1.5 bg-red-50 text-red-600 rounded-lg">Löschen</button>
                                        <button onclick="handleAddManagerPrompt('${c.id}')" class="text-xs px-2.5 py-1.5 bg-brand-50 text-brand-600 rounded-lg">+ Manager</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- TEAMS ABSCHNITT -->
                    <section class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold">Deine Teams</h2>
                            <button onclick="handleCreateTeam()" class="px-3 py-1.5 bg-brand-600 text-white text-xs font-medium rounded-xl shadow">+ Team anlegen</button>
                        </div>
                        <div class="grid gap-3">
                            ${myTeams.length === 0 ? '<p class="text-xs text-gray-500">Du bist noch keinem Team als Coach oder Mitglied zugeteilt.</p>' : ''}
                            ${myTeams.map(t => {
                                const isCoach = t.coaches && t.coaches.includes(state.currentUser.email);
                                const assignedClub = state.clubs.find(c => c.id === t.club_id);
                                return `
                                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border dark:border-gray-700 space-y-2">
                                        <div class="flex justify-between items-center">
                                            <div>
                                                <h3 class="font-bold text-sm">${t.name} <span class="text-xs font-normal text-gray-500">(${t.description || 'Keine Beschreibung'})</span></h3>
                                                <p class="text-xs text-brand-600 font-medium">Verein: ${assignedClub ? assignedClub.name : 'Kein Verein zugeordnet'}</p>
                                                <p class="text-[10px] text-emerald-600">Coach: ${(t.coaches || []).map(c => getNickname(c)).join(', ')}</p>
                                                <p class="text-[10px] text-gray-500">Mitglieder: ${(t.members || []).map(m => getNickname(m)).join(', ') || 'Keine'}</p>
                                            </div>
                                            <div class="flex items-center gap-1">
                                                ${isCoach ? `
                                                    <button onclick="handleEditTeam('${t.id}')" class="text-xs px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">Bearbeiten</button>
                                                    <button onclick="handleDeleteTeam('${t.id}')" class="text-xs px-2 py-1 bg-red-50 text-red-600 rounded">Löschen</button>
                                                    <button onclick="handleAddTeamUserPrompt('${t.id}', 'member')" class="text-xs px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">+ Mitglied</button>
                                                    <button onclick="handleAddTeamUserPrompt('${t.id}', 'coach')" class="text-xs px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">+ Coach</button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>

                </main>
            `;
        }

async function handleCreateClub() {
            const name = prompt("Name des Vereins:");
            if (!name) return;
            const zip_code = prompt("Postleitzahl:");
            const city = prompt("Ort:");

            const { error } = await supabaseClient.from('clubs').insert([{
                name, zip_code, city,
                created_by: state.currentUser.id,
                managers: [state.currentUser.email]
            }]);

            if (error) {
                alert("Fehler beim Erstellen: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleEditClub(clubId) {
            const club = state.clubs.find(c => c.id === clubId);
            if (!club) return;

            const name = prompt("Neuer Name des Vereins:", club.name);
            if (!name) return;
            const zip_code = prompt("Neue Postleitzahl:", club.zip_code || '');
            const city = prompt("Neuer Ort:", club.city || '');

            const { error } = await supabaseClient.from('clubs').update({ name, zip_code, city }).eq('id', clubId);
            if (error) {
                alert("Fehler beim Aktualisieren: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleDeleteClub(clubId) {
            if (!confirm("Möchtest du diesen Verein wirklich löschen?")) return;
            const { error } = await supabaseClient.from('clubs').delete().eq('id', clubId);
            if (error) {
                alert("Fehler beim Löschen: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleCreateTeam() {
            if (state.clubs.length === 0) {
                alert("Du musst zuerst mindestens einen Verein anlegen, bevor du ein Team erstellen kannst!");
                return;
            }

            const name = prompt("Name des Teams:");
            if (!name) return;
            const description = prompt("Beschreibung (z.B. Herren Ü50):");

            // Verein auswählen lassen
            let clubListText = state.clubs.map((c, idx) => `${idx + 1}: ${c.name}`).join('\n');
            let clubIndexInput = prompt(`Wähle den Verein für dieses Team (Nummer eingeben):\n${clubListText}`);
            let clubIndex = parseInt(clubIndexInput) - 1;

            if (isNaN(clubIndex) || !state.clubs[clubIndex]) {
                alert("Ungültige Verein-Auswahl.");
                return;
            }
            const selectedClubId = state.clubs[clubIndex].id;

            const { error } = await supabaseClient.from('teams').insert([{
                name, description,
                club_id: selectedClubId,
                created_by: state.currentUser.id,
                coaches: [state.currentUser.email],
                members: []
            }]);

            if (error) {
                alert("Fehler beim Erstellen: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleEditTeam(teamId) {
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;

            const name = prompt("Neuer Name des Teams:", team.name);
            if (!name) return;
            const description = prompt("Neue Beschreibung:", team.description || '');

            let clubListText = state.clubs.map((c, idx) => `${idx + 1}: ${c.name}`).join('\n');
            let clubIndexInput = prompt(`Wähle den Verein für dieses Team (Nummer eingeben):\n${clubListText}`);
            let clubIndex = parseInt(clubIndexInput) - 1;

            let updateData = { name, description };
            if (!isNaN(clubIndex) && state.clubs[clubIndex]) {
                updateData.club_id = state.clubs[clubIndex].id;
            }

            const { error } = await supabaseClient.from('teams').update(updateData).eq('id', teamId);
            if (error) {
                alert("Fehler beim Aktualisieren: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleDeleteTeam(teamId) {
            if (!confirm("Möchtest du dieses Team wirklich löschen?")) return;
            const { error } = await supabaseClient.from('teams').delete().eq('id', teamId);
            if (error) {
                alert("Fehler beim Löschen: " + error.message);
            } else {
                await loadClubsAndTeams();
                render();
            }
        }

        async function handleAddManagerPrompt(clubId) {
            const newEmail = prompt("E-Mail-Adresse des neuen Vereinsmanagers:");
            if (!newEmail) return;

            const club = state.clubs.find(c => c.id === clubId);
            if (!club) return;

            const updatedManagers = [...new Set([...(club.managers || []), newEmail])];
            await supabaseClient.from('clubs').update({ managers: updatedManagers }).eq('id', clubId);
            await loadClubsAndTeams();
            render();
        }

        async function toggleClubPublish(clubId, targetState) {
            const { error } = await supabaseClient.from('clubs').update({ is_published: targetState }).eq('id', clubId);
            if (!error) {
                await loadClubsAndTeams();
                render();
            } else {
                alert("Fehler beim Aktualisieren: " + error.message);
            }
        }

        async function handleAddTeamUserPrompt(teamId, role) {
            const newEmail = prompt(`E-Mail-Adresse des neuen Team-${role === 'coach' ? 'Coaches' : 'Mitglieds'}:`);
            if (!newEmail) return;

            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;

            if (role === 'coach') {
                const updatedCoaches = [...new Set([...(team.coaches || []), newEmail])];
                await supabaseClient.from('teams').update({ coaches: updatedCoaches }).eq('id', teamId);
            } else {
                const updatedMembers = [...new Set([...(team.members || []), newEmail])];
                await supabaseClient.from('teams').update({ members: updatedMembers }).eq('id', teamId);
            }

            await loadClubsAndTeams();
            render();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
